
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เพิ่มหอพัก | DormHub</title>

    <link rel="stylesheet" href="/static/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        .add-page {
            min-height: 100vh;
            background: #f7f8fc;
            padding: 40px 20px 80px;
        }

        .add-container {
            max-width: 800px;
            margin: auto;
        }

        .add-back {
            display: inline-block;
            color: #635bff;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .add-header {
            margin-bottom: 25px;
        }

        .add-header h1 {
            font-family: "Kanit", sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #172033;
        }

        .add-header p {
            color: #8993a4;
            font-size: 13px;
            margin-top: 5px;
        }

        .add-card {
            background: #fff;
            border: 1px solid #edf0f5;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(31,41,55,.04);
        }

        .add-card h2 {
            font-family: "Kanit", sans-serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .add-card-subtitle {
            color: #98a2b3;
            font-size: 12px;
            margin-bottom: 28px;
        }

        .add-field {
            margin-bottom: 23px;
        }

        .add-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 9px;
            color: #344054;
        }

        .add-required {
            color: #e74c3c;
        }

        .add-field input,
        .add-field textarea {
            display: block;
            width: 100%;
            border: 1px solid #e2e6ef;
            border-radius: 11px;
            padding: 13px 15px;
            outline: none;
            background: #fff;
            color: #172033;
            font-family: "Prompt", sans-serif;
            font-size: 13px;
            transition: .2s;
        }

        .add-field input:focus,
        .add-field textarea:focus {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99,91,255,.10);
        }

        .add-field textarea {
            resize: vertical;
            min-height: 120px;
        }

        .add-field small {
            display: block;
            margin-top: 7px;
            font-size: 11px;
            color: #98a2b3;
        }

        .add-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #edf0f5;
            padding-top: 24px;
            margin-top: 30px;
        }

        .add-cancel,
        .add-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 23px;
            border-radius: 10px;
            font-family: "Prompt", sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .add-cancel {
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #667085;
        }

        .add-submit {
            border: none;
            background: linear-gradient(135deg, #5b55e8, #7c3aed);
            color: #fff;
        }

        .add-submit:hover {
            filter: brightness(1.08);
        }

        .add-error {
            padding: 12px 15px;
            background: #fef3f2;
            color: #b42318;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .add-page {
                padding: 25px 15px 50px;
            }

            .add-card {
                padding: 24px 18px;
            }

            .add-header h1 {
                font-size: 27px;
            }

            .add-actions {
                flex-direction: column;
            }

            .add-cancel,
            .add-submit {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<main class="add-page">

    <div class="add-container">

        <a href="/landlord" class="add-back">
            ← กลับไปหน้า Dashboard
        </a>

        <div class="add-header">
            <h1>🏢 เพิ่มหอพักใหม่</h1>
            <p>
                ลงประกาศหอพักของคุณบน DormHub
            </p>
        </div>

        <div class="add-card">

            <h2>ข้อมูลหอพัก</h2>

            <p class="add-card-subtitle">
                กรอกข้อมูลหอพักที่ต้องการลงประกาศ
            </p>

            {{if .Error}}
                <div class="add-error">
                    ⚠️ {{.Error}}
                </div>
            {{end}}

            <form action="/landlord/add" method="POST" enctype="multipart/form-data">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{.CSRFToken}}"
                >

                <!-- DORM NAME -->

                <div class="add-field">

                    <label for="dorm-name">
                        🏠 ชื่อหอพัก
                        <span class="add-required">*</span>
                    </label>

                    <input
                        id="dorm-name"
                        type="text"
                        name="dorm_name"
                        placeholder="เช่น บ้านสุขใจ Residence"
                        maxlength="150"
                        required
                    >

                </div>

                <!-- ADDRESS -->

                <div class="add-field">

                    <label for="dorm-address">
                        📍 ที่อยู่หอพัก
                        <span class="add-required">*</span>
                    </label>

                    <textarea
                        id="dorm-address"
                        name="address"
                        placeholder="เช่น ต.ขามเรียง อ.กันทรวิชัย จ.มหาสารคาม"
                        rows="3"
                        maxlength="2000"
                        required
                    ></textarea>

                </div>

                <!-- DESCRIPTION -->

                <div class="add-field">

                    <label for="dorm-description">
                        📝 รายละเอียดหอพัก
                    </label>

                    <textarea
                        id="dorm-description"
                        name="description"
                        placeholder="รายละเอียดหอพัก บรรยากาศ สิ่งอำนวยความสะดวก..."
                        rows="5"
                        maxlength="5000"
                    ></textarea>

                </div>

                <!-- LOCAL IMAGE UPLOAD -->
                <div class="add-field">
                    <label for="dorm-image">🖼️ เลือกรูปภาพหอพักจากเครื่อง</label>
                    <input
                        id="dorm-image"
                        type="file"
                        name="image_file"
                        accept="image/jpeg,image/png,image/gif,image/webp"
                        style="padding:12px;background:#f8f9ff;cursor:pointer;"
                    >
                    <small>รองรับ JPG, PNG, GIF และ WebP ขนาดไม่เกิน 5 MB · ไม่ใส่รูปก็ได้</small>
                    <img id="dorm-image-preview" alt="ตัวอย่างรูปภาพหอพัก" style="display:none;max-width:100%;max-height:280px;object-fit:contain;margin-top:12px;border-radius:12px;border:1px solid #e2e6ef;">
                </div>

                <!-- BUTTONS -->

                <div class="add-actions">

                    <a href="/landlord" class="add-cancel">
                        ยกเลิก
                    </a>

                    <button class="add-submit" type="submit">
                        + บันทึกหอพัก
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

<script>
(function () {
    const input = document.getElementById('dorm-image');
    const preview = document.getElementById('dorm-image-preview');
    let activeURL = null;
    input.addEventListener('change', function () {
        if (activeURL) URL.revokeObjectURL(activeURL);
        activeURL = null;
        preview.removeAttribute('src');
        preview.style.display = 'none';
        const file = input.files && input.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
            alert('รูปภาพต้องมีขนาดไม่เกิน 5 MB');
            input.value = '';
            return;
        }
        if (!['image/jpeg','image/png','image/gif','image/webp'].includes(file.type)) {
            alert('เลือกรูปภาพ JPG, PNG, GIF หรือ WebP เท่านั้น');
            input.value = '';
            return;
        }
        activeURL = URL.createObjectURL(file);
        preview.src = activeURL;
        preview.style.display = 'block';
    });
    window.addEventListener('pagehide', function () {
        if (activeURL) URL.revokeObjectURL(activeURL);
    });
})();
</script>

</body>
</html>
